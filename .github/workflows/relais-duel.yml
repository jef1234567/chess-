name: Test du relais du duel
# Vérifie que le relais public ntfy.sh accepte ce que fait js/duel.js depuis un navigateur :
# envoi POST simple (sans pré-vérification CORS), en-tête CORS, flux SSE avec since=all.
on:
  push:
    paths: ["js/duel.js", ".github/workflows/relais-duel.yml"]
  workflow_dispatch:
jobs:
  relais:
    runs-on: ubuntu-latest
    steps:
      - name: Envoi puis lecture d'un message
        run: |
          set -e
          T="salle-armes-test-$RANDOM$RANDOM$RANDOM"
          O="https://jef1234567.github.io"
          echo "== POST"
          curl -sS -D post.h -o post.b -H "Origin: $O" -H "Content-Type: text/plain;charset=UTF-8" --data "sa1:dGVzdA==" "https://ntfy.sh/$T?firebase=no"
          cat post.h post.b; echo
          grep -qi '^HTTP/[0-9.]* 200' post.h
          grep -qi '^access-control-allow-origin: \*' post.h
          grep -q '"message":"sa1:dGVzdA=="' post.b
          echo "== SSE since=all"
          curl -sS -D sse.h -o sse.b -m 5 -H "Origin: $O" -H "Accept: text/event-stream" "https://ntfy.sh/$T/sse?since=all" || true
          cat sse.h sse.b
          grep -qi '^access-control-allow-origin: \*' sse.h
          grep -q '"event":"message"' sse.b
          grep -q '"message":"sa1:dGVzdA=="' sse.b
          echo "== SSE since=<id>"
          ID=$(grep -o '"id":"[^"]*"' post.b | head -1 | cut -d'"' -f4)
          curl -sS -o sse2.b -m 4 "https://ntfy.sh/$T/sse?since=$ID" || true
          cat sse2.b
          ! grep -q '"event":"message"' sse2.b
          echo "Relais OK"
